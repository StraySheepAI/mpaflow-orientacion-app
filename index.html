<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MPA Flow · Orientación del sistema</title>
<style>
:root{--bg:#07020d;--panel:#170924;--line:#64357a;--text:#f1e9f4;--muted:#b2a2bc;--pink:#e52aff;--violet:#c77bff;--gold:#efc978}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 8%,#46165e 0,transparent 32%),radial-gradient(circle at 10% 90%,#200d3d 0,transparent 38%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{width:min(1140px,calc(100% - 32px));margin:24px auto;min-height:calc(100vh - 48px);display:grid;grid-template-columns:255px 1fr;border:1px solid #3d2050;border-radius:26px;overflow:hidden;background:rgba(8,2,14,.9);box-shadow:0 28px 90px #0008}aside{padding:32px 25px;border-right:1px solid #3d2050;background:linear-gradient(180deg,#2d0e3e88,transparent 75%)}main{position:relative;padding:52px clamp(24px,6vw,78px);overflow:hidden}main:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#be5aff0a 1px,transparent 1px),linear-gradient(90deg,#be5aff0a 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(90deg,#000,transparent 85%);pointer-events:none}.brand,.progress,.steps,.back{position:relative;z-index:1}.brand{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--violet)}.brand b{display:block;font-size:29px;letter-spacing:.08em;color:#fff;margin-top:12px}.back{color:var(--muted);text-decoration:none;font-size:13px}.progress{margin-top:52px}.progress small{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}.bar{height:5px;background:#30163d;border-radius:4px;margin-top:12px}.fill{height:100%;width:25%;background:linear-gradient(90deg,var(--pink),var(--violet));transition:.35s}.steps{display:grid;gap:19px;margin-top:28px}.step{display:flex;gap:11px;align-items:center;color:#796783;font-size:13px}.step i{width:25px;height:25px;border:1px solid #593169;border-radius:50%;display:grid;place-items:center;font-style:normal}.step.active{color:#fff}.step.active i{background:var(--pink);border-color:var(--pink);box-shadow:0 0 18px #e62aff73}h1{position:relative;font:500 clamp(42px,7vw,82px)/.94 Georgia,serif;margin:24px 0 20px;z-index:1}h1 em,h2 em{color:var(--violet);font-style:italic}.lead{position:relative;max-width:640px;color:var(--muted);font-size:17px;line-height:1.7;z-index:1}.screen{position:relative;margin-top:38px;border:1px solid var(--line);border-radius:22px;padding:29px;background:linear-gradient(135deg,#2e103dd1,#0f0517e6);box-shadow:0 18px 50px #0004;z-index:1}.screen:after{content:"";position:absolute;width:170px;height:170px;right:-65px;top:-70px;border:1px solid #da71ff38;border-radius:50%;box-shadow:0 0 0 18px #d35dff0a,0 0 0 38px #d35dff08;pointer-events:none}.screen-kicker{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:13px}h2{font:500 34px Georgia,serif;margin:0 0 10px;max-width:620px}.hint{color:var(--muted);line-height:1.6;max-width:600px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:23px}.option{position:relative;min-height:76px;border:1px solid #4f2861;background:#0d0514b8;color:var(--text);border-radius:15px;padding:17px 18px 17px 48px;text-align:left;cursor:pointer;font-size:15px;line-height:1.4;transition:.22s}.option:before{content:"";position:absolute;left:17px;top:18px;width:18px;height:18px;border:1px solid var(--violet);border-radius:50%;box-shadow:0 0 0 5px #c77bff0f}.option:hover{border-color:var(--pink);transform:translateY(-3px);background:#411653bf;box-shadow:0 10px 25px #0004}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.result-box{border:1px solid #4f2861;padding:17px;border-radius:15px;background:#0d051475}.result-box strong,.route strong{display:block;color:var(--violet);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}.result-box p{margin:0;line-height:1.55}.route{margin-top:18px;padding:15px 17px;border-left:2px solid var(--pink);background:#e62aff14;line-height:1.6}.cta{display:inline-block;margin-top:24px;padding:14px 23px;border-radius:25px;background:linear-gradient(100deg,#d922f1,#fa4bff);color:#fff;text-decoration:none;font-weight:bold;box-shadow:0 10px 28px #e62aff33}.restart{display:inline-block;margin:24px 0 0 15px;color:var(--muted);font-size:13px;cursor:pointer;background:none;border:0}@media(max-width:720px){.app{display:block;margin:0;width:100%;min-height:100vh;border:0;border-radius:0}aside{border-right:0;border-bottom:1px solid #3d2050;padding:22px}.progress{margin-top:22px}.steps{grid-template-columns:repeat(4,1fr);gap:6px}.step{display:grid;justify-items:center;text-align:center;font-size:10px}.step i{width:22px;height:22px}main{padding:31px 20px}.options,.result-grid{grid-template-columns:1fr}h1{font-size:52px}.screen{padding:22px 18px}}
</style></head><body><div class="app"><aside><a class="back" href="https://mpaflow.com/#servicios">← Volver a MPA Flow</a><div class="brand" style="margin-top:34px">MPA Flow<b>ORIENTACIÓN</b></div><div class="progress"><small id="progressLabel">Paso 1 de 4</small><div class="bar"><div class="fill" id="fill"></div></div></div><div class="steps"><div class="step active"><i>1</i><span>Momento</span></div><div class="step"><i>2</i><span>Tendencia</span></div><div class="step"><i>3</i><span>Objetivo</span></div><div class="step"><i>4</i><span>Mapa</span></div></div></aside><main><div class="brand">Una primera lectura del sistema</div><h1>¿Qué necesita hoy<br><em>tu organización?</em></h1><p class="lead">Tres preguntas para reconocer el momento actual, la tendencia que aparece y el próximo paso que puede generar más correspondencia.</p><div class="screen" id="screen"></div></main></div><script>
const data=[{title:'¿En qué momento está hoy tu organización?',hint:'Elegí la situación que más se parece a la que están atravesando.',options:[['growth','Estamos creciendo y queremos sostener el próximo nivel.'],['automation','Queremos automatizar y necesitamos definir por dónde empezar.'],['dependency','La operación funciona, pero depende demasiado de personas clave.'],['technology','Estamos incorporando tecnología y queremos que encuentre su lugar.'],['alignment','Tenemos muchas iniciativas y necesitamos conectar prioridades.'],['adoption','El cambio ya comenzó y queremos que pueda sostenerse.']]},{title:'Cuando aumenta la complejidad, ¿qué aparece primero?',hint:'Esto ayuda a reconocer la tendencia del sistema.',options:[['growth','La operación se sobrecarga y los acuerdos informales ya no alcanzan.'],['automation','Se agregan herramientas antes de comprender el flujo completo.'],['dependency','Las decisiones importantes esperan a una persona.'],['technology','La herramienta no refleja todavía cómo se trabaja realmente.'],['alignment','Los equipos trabajan mucho, pero en direcciones diferentes.'],['adoption','La solución existe, pero todavía no forma parte del trabajo cotidiano.']]},{title:'¿Qué te gustaría hacer posible?',hint:'Elegí el objetivo que más valor tendría ahora.',options:[['growth','Crecer con una operación clara y sostenible.'],['automation','Reducir tiempos, repeticiones y retrabajo.'],['dependency','Distribuir conocimiento, ownership y capacidad de decisión.'],['technology','Integrar tecnología, procesos y personas.'],['alignment','Tomar decisiones con una visión compartida.'],['adoption','Lograr autonomía y evolución después de la implementación.']]}];let step=0,answers=[];const screen=document.getElementById('screen'),fill=document.getElementById('fill'),label=document.getElementById('progressLabel'),steps=[...document.querySelectorAll('.step')];function render(){if(step===3)return renderResult();const q=data[step];label.textContent=`Paso ${step+1} de 4`;fill.style.width=`${(step+1)*25}%`;steps.forEach((s,i)=>s.classList.toggle('active',i===step));screen.innerHTML=`<div class="screen-kicker">Lectura ${String(step+1).padStart(2,'0')} · ${['Momento','Tendencia','Objetivo'][step]}</div><h2>${q.title}</h2><p class="hint">${q.hint}</p><div class="options">${q.options.map(o=>`<button class="option" data-key="${o[0]}">${o[1]}</button>`).join('')}</div>`;screen.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers.push({key:b.dataset.key,text:b.textContent});step++;render()})}function renderResult(){const key=answers[2]?.key||answers[0]?.key||'growth';const names={growth:'Capacidad para crecer',automation:'Automatización con correspondencia',dependency:'Autonomía distribuida',technology:'Tecnología integrada al sistema',alignment:'Dirección compartida',adoption:'Evolución sostenible'};const next={growth:'Mapear un flujo prioritario y diseñar la arquitectura operativa que sostenga el próximo nivel.',automation:'Medir repeticiones, esperas y retrabajo antes de elegir una automatización.',dependency:'Diseñar ownership, documentación, transferencia y capacidades internas.',technology:'Modelar el flujo real y configurar la tecnología para acompañarlo.',alignment:'Construir una vista común de prioridades, decisiones, información y dependencias.',adoption:'Planificar habilitación, capacitación, soporte y evolución.'};label.textContent='Mapa de orientación';fill.style.width='100%';steps.forEach((s,i)=>s.classList.toggle('active',i===3));screen.innerHTML=`<div class="screen-kicker">Lectura 04 · Mapa de orientación</div><h2>Tu sistema está pidiendo <em>${names[key]}</em></h2><p class="hint">Esta es una primera orientación, no un diagnóstico cerrado. Te ayuda a decidir qué conviene mirar antes de intervenir.</p><div class="result-grid"><div class="result-box"><strong>Situación actual</strong><p>${answers[0]?.text||''}</p></div><div class="result-box"><strong>Tendencia</strong><p>${answers[1]?.text||''}</p></div><div class="result-box"><strong>Objetivo</strong><p>${answers[2]?.text||''}</p></div></div><div class="route"><strong>Ruta sugerida</strong>${next[key]}</div><a class="cta" href="mailto:mpaflowconsulting@gmail.com?subject=Orientación MPA Flow">Conversar sobre este escenario →</a><button class="restart" onclick="step=0;answers=[];render()">Volver a empezar</button>`}render();
</script></body></html>
